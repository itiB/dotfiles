[git_status]
style = "bold green"
conflicted = "⚡️"
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "*${count} "
modified = "!${count} "
staged = "+${count} "
deleted = "✘${count} "
format = '([$all_status$ahead_behind]($style) )'
